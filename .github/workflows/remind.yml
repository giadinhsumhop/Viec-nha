name: Nhac viec Zalo
on:
  schedule:
    - cron: '*/15 * * * *'   # nháº¯c viá»‡c má»—i 15 phĂºt
    - cron: '0 13 * * *'     # 20:00 giá» VN: tá»•ng káº¿t ngĂ y
  workflow_dispatch:
    inputs:
      mode:
        description: 'alerts | summary | getid'
        default: 'alerts'
concurrency: nhac-viec
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node bot/remind.mjs
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 13 * * *' && 'summary' || 'alerts') }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BOT_SECRET: ${{ secrets.BOT_SECRET }}
          ZALO_TOKEN: ${{ secrets.ZALO_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
