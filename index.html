<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Việc nhà</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#777;--ac:#2f7d5b;--bad:#c0392b;--bd:#e3e1da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#171815;--card:#222320;--tx:#eee;--mu:#9a9a92;--ac:#4fb589;--bad:#e5645a;--bd:#34352f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
header{padding:12px 14px 4px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:19px;margin:0}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;position:sticky;top:0;background:var(--bg);z-index:2}
#tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 14px;font-size:15px}
#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:6px 14px 130px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:10px;align-items:flex-start}
.row input[type=checkbox]{width:24px;height:24px;flex:none;margin-top:2px}
.mu{color:var(--mu);font-size:13px}.late{color:var(--bad)}.done .t{text-decoration:line-through;color:var(--mu)}
input,button.pri{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
button.pri{background:var(--ac);color:#fff;border:0}
button.sec{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:none;color:var(--tx)}
form{display:flex;flex-wrap:wrap;gap:8px}form input[type=text],form input[type=email],form input[type=password]{flex:1 1 100%}
img.ph{max-width:100%;max-height:200px;border-radius:8px;margin-top:6px;display:block}
.msg{max-width:85%;padding:8px 11px;border-radius:14px;margin:6px 0;background:var(--card);border:1px solid var(--bd);word-break:break-word}
.msg.me{margin-left:auto;background:var(--ac);color:#fff;border-color:var(--ac)}
.msg b{font-size:12px;display:block;opacity:.8}
#chatbar{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--bd)}
#chatbar input{flex:1}
label.up{display:inline-block;margin-top:6px;font-size:14px;color:var(--ac);border:1px dashed var(--ac);border-radius:8px;padding:5px 10px}
.tag{font-weight:700;color:var(--ac);background:rgba(47,125,91,.14);border-radius:6px;padding:0 3px}.msg.me .tag{color:#fff;background:rgba(255,255,255,.25)}.msg.ment{border-left:4px solid var(--ac)}#chips,#chips2{flex:1 1 100%;display:flex;gap:6px;overflow-x:auto}#chips button,#chips2 button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:4px 10px;font-size:14px}
.av{width:var(--s,26px);height:var(--s,26px);border-radius:50%;object-fit:cover;vertical-align:middle;display:inline-flex;align-items:center;justify-content:center;background:var(--ac);color:#fff;font-size:calc(var(--s,26px)*.45);font-weight:700;flex:none}
#tabs .av{margin-right:6px;--s:22px}.msg b .av{margin-right:4px}
.stats{display:flex;gap:8px}.stats div{flex:1;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 4px}.stats b{display:block;font-size:22px}.stats .bad b{color:var(--bad)}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}.prow .n{flex:1}.prow em{font-style:normal;min-width:48px;text-align:center}
#crop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
#crop canvas{width:260px;height:260px;border-radius:50%;background:#000;touch-action:none;border:3px solid #fff}
.gcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:8px 0}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px;font:inherit}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.fhead{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:18px}
.fgrid{display:grid;gap:4px}.fgrid button{aspect-ratio:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:0;font-weight:700}
.fgrid button.ok{opacity:.15}.fgrid button.bad{background:var(--bad);color:#fff}
.cgrid{display:grid;gap:2px;background:var(--bd);padding:2px;border-radius:8px}.cgrid button{aspect-ratio:1;border:0;background:var(--card);padding:0;font-size:18px;font-weight:700;color:var(--tx)}
.cgrid .x{color:#c0392b}.cgrid .o{color:#2f6fb5}.cgrid .last{background:rgba(255,200,0,.35)}.cgrid .win{background:rgba(47,125,91,.4)}
.inv{background:var(--ac);color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pbar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:2px 0 8px}.pbar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.pls{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pls span{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:14px}
.err{color:var(--bad);font-size:14px;width:100%}
</style></head><body>
<header><h1>🏠 Việc nhà</h1><span class="mu" id="who"></span></header>
<div id="inv"></div>
<div id="tabs"></div><main id="main"><p class="mu">Đang tải…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
// ===== ĐIỀN 2 DÒNG NÀY (Supabase > Project Settings > API) =====
const SUPABASE_URL="https://fpglnulblraiviiypaeq.supabase.co";
const SUPABASE_KEY="sb_publishable_-XHUDFaDuyjN3UEto0bdwQ_amS0Ym1I";
// ================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me,members={},tasks=[],chat=[],tab="all",timer;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=d=>d?d.split("-").reverse().slice(0,2).join("/"):"";
const nm=id=>(members[id]&&members[id].name)||"Ai đó";

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  me=session.user.id;await load();
  if(!members[me])return joinView();
  sb.channel("fam").on("postgres_changes",{event:"*",schema:"public"},p=>{if(p&&(p.table==="games"||p.table==="scores"))return;clearTimeout(timer);timer=setTimeout(async()=>{await load();render()},250)}).subscribe();
  setInterval(poll,4000);document.addEventListener("visibilitychange",poll);
  render();invCheck();
}
async function poll(){
  if(document.hidden||!me||!members[me])return;
  invCheck();
  const sig=()=>JSON.stringify([chat.map(c=>c.id),tasks.map(t=>[t.id,t.done,t.photo]),Object.values(members).map(x=>x.id+x.name+(x.avatar||""))]);
  const b=sig();await load();if(sig()!==b)render();
}
async function load(){
  const[m,t,c]=await Promise.all([sb.from("members").select("*"),sb.from("tasks").select("*"),
    sb.from("chat").select("*").order("created_at",{ascending:false}).limit(100)]);
  window.loadErr=(m.error||t.error||c.error||{}).message||"";members={};(m.data||[]).forEach(x=>members[x.id]=x);tasks=(t.data||[]).filter(x=>!(x.done&&Date.now()-new Date(x.done_at||x.created_at).getTime()>3*864e5));chat=(c.data||[]).reverse();
}
function authView(){
  $("#tabs").innerHTML="";
  $("#main").innerHTML=`<form id="a" class="card"><b style="flex:1 1 100%">Đăng nhập</b>
  <input type="email" name="e" placeholder="Email" required autocomplete="username">
  <input type="password" name="p" placeholder="Mật khẩu (từ 6 ký tự)" required minlength="6" autocomplete="current-password">
  <button class="pri" value="in">Đăng nhập</button><button class="sec" type="button" id="su">Tạo tài khoản</button><div class="err" id="err"></div></form>`;
  const go=async fn=>{const f=$("#a");$("#err").textContent="";
    const{data,error}=await sb.auth[fn]({email:f.e.value.trim(),password:f.p.value});
    if(error)return $("#err").textContent=error.message;
    if(!data.session)return $("#err").textContent="Cần tắt 'Confirm email' trong Supabase (Auth > Providers > Email).";
    init()};
  $("#a").onsubmit=e=>{e.preventDefault();go("signInWithPassword")};
  $("#su").onclick=()=>{if($("#a").reportValidity())go("signUp")};
}
function joinView(){
  $("#main").innerHTML=`<form id="j" class="card"><b style="flex:1 1 100%">Tham gia gia đình</b>
  <input type="text" name="n" placeholder="Tên của bạn (VD: Bố, Mẹ, Mai, Bin)" required maxlength="20">
  <input type="text" name="c" placeholder="Mã gia đình" required>
  <button class="pri">Vào</button><button class="sec" type="button" id="lo">Đăng xuất</button><div class="err" id="err">${esc(window.loadErr?"Không đọc được dữ liệu: "+window.loadErr:"")}</div></form>`;
  $("#lo").onclick=async()=>{await sb.auth.signOut();location.reload()};
  $("#j").onsubmit=async e=>{e.preventDefault();const f=e.target;
    const{error}=await sb.rpc("join_family",{p_code:f.c.value.trim(),p_name:f.n.value.trim()});
    if(error)return $("#err").textContent=error.message;await init();if(!members[me]&&!window.loadErr)$("#err").textContent="Đã tham gia nhưng chưa đọc được danh sách (thiếu quyền đọc). Chạy fix.sql trong Supabase."};
}
function render(){
  if(tab!=="game")leaveRoom();
  $("#who").innerHTML=av(me,24)+" "+esc(nm(me));
  const ids=Object.keys(members).sort((a,b)=>a===me?-1:b===me?1:nm(a).localeCompare(nm(b)));
  $("#tabs").innerHTML=[["all","📋 Tổng hợp"],["chat","💬 Chat"],["game","🎮 Giải trí"],...ids.map(i=>[i,av(i)+esc(i===me?"Của tôi":nm(i))])]
    .map(([k,l])=>`<button class="${k===tab?"on":""}" data-k="${esc(k)}">${l}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;$("#main").dataset.t="";render();window.scrollTo(0,0)});
  const cb=$("#chatbar");if(cb&&tab!=="chat")cb.remove();
  if(tab==="game")return renderGame();
  if(tab==="chat")return renderChat();
  if(tab==="all")return renderAll();
  renderPerson(tab);
}
const hm=x=>x?x.slice(0,5):"";
const key=t=>(t.due||"9")+" "+(t.start_time||"99");
const when=t=>(t.due?"hạn "+fmt(t.due):"không hạn")+(t.start_time?" · "+hm(t.start_time)+(t.end_time?"–"+hm(t.end_time):""):"");
function isLate(t){if(t.done||!t.due)return false;const n=new Date(),hh=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),e=t.end_time||t.start_time;return t.due<today()||(t.due===today()&&!!e&&hm(e)<hh)}
function tagify(b){const h=esc(b),ns=Object.values(members).map(x=>esc(x.name).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).sort((a,c)=>c.length-a.length);if(!ns.length)return h;return h.replace(new RegExp("@("+ns.join("|")+")(?![\\wÀ-ỹ])","gi"),m=>`<span class="tag">${m}</span>`)}
const mentionsMe=b=>!!members[me]&&b.toLowerCase().includes("@"+members[me].name.toLowerCase());
function taskCard(t,showWho){
  const late=isLate(t),mine=t.assignee===me;
  return `<div class="card ${t.done?"done":""}"><div class="row">
  <input type="checkbox" ${t.done?"checked":""} ${mine?"":"disabled"} data-done="${t.id}">
  <div style="flex:1"><div class="t">${esc(t.title)}</div>
  <div class="mu ${late?"late":""}">${showWho?av(t.assignee,18)+" "+esc(nm(t.assignee))+" · ":""}${when(t)}${t.created_by&&t.created_by!==t.assignee?" · giao bởi "+esc(nm(t.created_by)):""}${late?" · QUÁ HẠN":""}${t.done?" · ✅ xong":""}</div>
  ${t.photo?`<a href="${esc(t.photo)}" target="_blank"><img class="ph" src="${esc(t.photo)}" alt="ảnh minh chứng"></a>`:""}
  ${mine&&!t.done?`<label class="up">📷 Gửi ảnh<input type="file" accept="image/*" hidden data-ph="${t.id}"></label>`:""}
  </div><button class="mu" style="border:0;background:none" data-del="${t.id}" title="Xoá">✕</button></div></div>`;
}
function resize(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    c.toBlob(b=>b?ok(b):no(new Error("Không đọc được ảnh")),"image/jpeg",.8)};im.onerror=()=>no(new Error("Không đọc được ảnh"));im.src=u})}
function bind(){
  document.querySelectorAll("[data-done]").forEach(c=>c.onchange=async()=>{
    const{error}=await sb.from("tasks").update({done:c.checked,done_at:c.checked?new Date().toISOString():null}).eq("id",c.dataset.done);
    if(error)alert(error.message);await load();render()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Xoá việc này?"))return;await sb.from("tasks").delete().eq("id",b.dataset.del);await load();render()});
  document.querySelectorAll("[data-ph]").forEach(f=>f.onchange=async()=>{
    if(!f.files[0])return;const id=f.dataset.ph;f.parentElement.textContent="Đang gửi…";
    try{const b=await resize(f.files[0]),path=me+"/"+id+"-"+Date.now()+".jpg";
      const u=await sb.storage.from("proofs").upload(path,b,{contentType:"image/jpeg"});if(u.error)throw u.error;
      const url=sb.storage.from("proofs").getPublicUrl(path).data.publicUrl;
      const r=await sb.from("tasks").update({photo:url}).eq("id",id);if(r.error)throw r.error;
    }catch(e){alert("Gửi ảnh lỗi: "+e.message)}await load();render()});
}
function av(id,sz){const m=members[id]||{},st=sz?`style="--s:${sz}px"`:"";return m.avatar?`<img class="av" ${st} src="${esc(m.avatar)}" alt="">`:`<span class="av" ${st}>${esc((m.name||"?").trim().charAt(0).toUpperCase())}</span>`}
function stat(list){const d=today(),t=list.filter(x=>x.due===d);return{n:t.length,done:t.filter(x=>x.done).length,late:t.filter(isLate).length,old:list.filter(x=>!x.done&&x.due&&x.due<d).length}}
function statBox(s){return `<div class="stats"><div><b>${s.n}</b><span class="mu">Việc hôm nay</span></div><div><b>${s.done}</b><span class="mu">Hoàn thành</span></div><div class="bad"><b>${s.late}</b><span class="mu">Quá hạn</span></div></div>`+(s.old?`<p class="mu late">Còn tồn từ các ngày trước: ${s.old} việc</p>`:"")}
function peopleRows(){return Object.keys(members).map(id=>{const s=stat(tasks.filter(x=>x.assignee===id));return `<div class="prow">${av(id,26)}<span class="n">${esc(nm(id))}</span><em>${s.n} việc</em><em>✅ ${s.done}</em><em class="${s.late?"late":""}">⏰ ${s.late}</em></div>`}).join("")}
function parseTags(text){const ids=[];let t=text;Object.entries(members).sort((a,b)=>b[1].name.length-a[1].name.length).forEach(([k,v])=>{const tag=("@"+v.name).toLowerCase();let i;while((i=t.toLowerCase().indexOf(tag))>=0){if(!ids.includes(k))ids.push(k);t=t.slice(0,i)+" "+t.slice(i+tag.length)}});return{ids,title:t.replace(/\s+/g," ").trim()}}
function cropAvatar(file){
  const img=new Image();
  img.onerror=()=>alert("Không đọc được ảnh");
  img.onload=()=>{
    const ov=document.createElement("div");ov.id="crop";
    ov.innerHTML='<div>Kéo để chỉnh vị trí, thanh trượt để phóng to</div><canvas width="260" height="260"></canvas><input type="range" min="1" max="3" step="0.02" value="1" style="width:240px"><div><button class="pri" id="cok">Lưu</button> <button class="sec" id="cno" style="color:#fff;border-color:#fff">Huỷ</button></div>';
    document.body.appendChild(ov);
    const cv=ov.querySelector("canvas"),rg=ov.querySelector("input"),base=260/Math.min(img.width,img.height);
    let z=1,ox=0,oy=0,d=null;
    const draw=(c,S)=>{const k=S/260,sc=base*z*k,w=img.width*sc,h=img.height*sc;c.fillStyle="#000";c.fillRect(0,0,S,S);c.drawImage(img,(S-w)/2+ox*k,(S-h)/2+oy*k,w,h)};
    const go=()=>{const mx=(img.width*base*z-260)/2,my=(img.height*base*z-260)/2;ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy));draw(cv.getContext("2d"),260)};
    rg.oninput=()=>{z=+rg.value;go()};
    cv.onpointerdown=e=>{d=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};
    cv.onpointermove=e=>{if(!d)return;ox+=e.clientX-d[0];oy+=e.clientY-d[1];d=[e.clientX,e.clientY];go()};
    cv.onpointerup=cv.onpointercancel=()=>{d=null};
    go();
    ov.querySelector("#cno").onclick=()=>ov.remove();
    ov.querySelector("#cok").onclick=()=>{
      const o=document.createElement("canvas");o.width=o.height=256;draw(o.getContext("2d"),256);
      o.toBlob(async b=>{try{
        const path=me+"/avatar-"+Date.now()+".jpg";
        const u=await sb.storage.from("proofs").upload(path,b,{contentType:"image/jpeg"});if(u.error)throw u.error;
        const url=sb.storage.from("proofs").getPublicUrl(path).data.publicUrl;
        const r=await sb.from("members").update({avatar:url}).eq("id",me);if(r.error)throw r.error;
        ov.remove();await load();render();
      }catch(e){alert("Lưu ảnh lỗi: "+e.message+" (đã chạy addavatar.sql chưa?)")}},"image/jpeg",.85)};
  };
  img.src=URL.createObjectURL(file);
}
function renderAll(){
  const m=$("#main");m.dataset.t="all";
  const open=tasks.filter(t=>!t.done).sort((a,b)=>key(a).localeCompare(key(b)));
  const done=tasks.filter(t=>t.done).sort((a,b)=>(b.done_at||"").localeCompare(a.done_at||"")).slice(0,5);
  m.innerHTML=`<h3>Hôm nay · cả nhà</h3>`+statBox(stat(tasks))+peopleRows()+`<p class="mu">Mỗi dòng: số việc hôm nay · ✅ xong · ⏰ quá hạn</p><h3>Sắp tới & chưa xong (${open.length})</h3>`+(open.map(t=>taskCard(t,true)).join("")||'<p class="mu">Không có việc nào 🎉</p>')
   +(done.length?`<h3>Mới hoàn thành</h3>`+done.map(t=>taskCard(t,true)).join(""):"");
  bind();
}
function renderPerson(id){
  const m=$("#main"),mine=id===me;
  if(m.dataset.t!==id){m.dataset.t=id;
    m.innerHTML=`<div id="top"></div><form id="f" class="card"><input type="text" name="title" placeholder="${mine?"Việc cần làm… (tag @tên để giao cho người khác)":"Giao việc cho "+esc(nm(id))+"… (VD: Học bài)"}" required maxlength="120">${mine?'<div id="chips2"></div>':""}<input type="date" name="due" value="${today()}"><span class="mu" style="align-self:center">Từ</span><input type="time" name="st"><span class="mu" style="align-self:center">đến</span><input type="time" name="et"><button class="pri">${mine?"Thêm việc":"Giao việc"}</button><div class="mu" style="width:100%">${mine?"Không tag ai thì việc là của bạn.":"Việc sẽ hiện ở tab của "+esc(nm(id))+"."}</div><div id="fmsg" style="width:100%;font-size:14px"></div></form><div id="list"></div>`;
    $("#f").onsubmit=async e=>{
      e.preventDefault();const f=e.target,fm=$("#fmsg"),say=(t,bad)=>{fm.textContent=t;fm.style.color=bad?"var(--bad)":"var(--ac)"};
      const p=parseTags(f.title.value);
      if(!p.title)return say("Nhập nội dung việc (ngoài phần @tên).",1);
      if(f.st.value&&f.et.value&&f.et.value<=f.st.value)return say("Giờ kết thúc phải sau giờ bắt đầu.",1);
      const ids=mine?(p.ids.length?p.ids:[me]):[id];
      say("Đang giao…");

const CN=12,CDIR=[[1,0],[0,1],[1,1],[1,-1]];
function caroWin(b,i,p){const x0=i%CN,y0=Math.floor(i/CN);for(const[dx,dy]of CDIR){const c=[i];for(const sg of[1,-1]){let x=x0+dx*sg,y=y0+dy*sg;while(x>=0&&x<CN&&y>=0&&y<CN&&b[y*CN+x]===p){c.push(y*CN+x);x+=dx*sg;y+=dy*sg}}if(c.length>=5)return c}return null}
function caroScore(b,i,p){let s=0;const x0=i%CN,y0=Math.floor(i/CN);for(const[dx,dy]of CDIR){let c=1,o=0;for(const sg of[1,-1]){let x=x0+dx*sg,y=y0+dy*sg;while(x>=0&&x<CN&&y>=0&&y<CN&&b[y*CN+x]===p){c++;x+=dx*sg;y+=dy*sg}if(x>=0&&x<CN&&y>=0&&y<CN&&b[y*CN+x]===0)o++}
  s+=c>=5?1e6:c===4?(o===2?1e5:o===1?1e4:0):c===3?(o===2?1e3:o===1?100:0):c===2?(o===2?100:o===1?10:0):o}return s}
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

function watch(id,cb){
  let alive=true,last="";
  const pull=async()=>{
    const r=await sb.from("games").select("*").eq("id",id).maybeSingle();
    if(!alive||r.error)return;
    if(!r.data){if(last){alive=false;cb(null)}return}
    const k=JSON.stringify(r.data);if(k!==last){last=k;G.row=r.data;cb(r.data)}
  };
  const ch=sb.channel("g"+id).on("postgres_changes",{event:"*",schema:"public",table:"games",filter:"id=eq."+id},()=>pull()).subscribe();
  const iv=setInterval(pull,1500);pull();
  return()=>{alive=false;clearInterval(iv);try{sb.removeChannel(ch)}catch(e){}};
}

    if(r.kind==="caro")return caroOnline(r);

    if(G.fsKey!==key){G.fsKey=key;findPlay(r.n,{seed:r.seed,room:r})}
  });

function findPlay(n,o={}){
  if(G.clr){G.clr();G.clr=null}
  const m=$("#main"),R=rng(o.seed||Math.floor(Math.random()*1e9)),room=o.room;
  const nums=[...Array(n).keys()].map(i=>i+1);
  for(let i=n-1;i>0;i--){const j=Math.floor(R()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}
  const sty=nums.map(()=>`font-size:${15+Math.floor(R()*7)}px;transform:rotate(${Math.floor(R()*25)-12}deg)`);
  const mine=room&&room.host===me?1:2,oc=3-mine,oppName=o.bot?"🤖 Máy":room?nm(oc===1?room.host:room.guest):"";
  let next=1,done=false,t0=0,tm=null,ls=0,cd=3,myMs=0;
  const oppProg=()=>o.bot?Math.min(n,Math.floor((Date.now()-t0)/o.bot.pace)):room&&G.row?(G.row["p"+oc]||0):0;
  const oppMs=()=>o.bot?(oppProg()>=n?n*o.bot.pace:null):room&&G.row?G.row["ms"+oc]:null;
  const cdt=setInterval(()=>{cd--;const e=$("#cd");if(cd<=0){clearInterval(cdt);start()}else if(e)e.textContent=cd},1000);
  G.clr=()=>{clearInterval(cdt);clearInterval(tm)};
  m.innerHTML=`<div class="gcard" style="text-align:center"><div id="cd" style="font-size:64px;font-weight:700">3</div>Sẵn sàng… ${oppName?"Đối thủ: <b>"+esc(oppName)+"</b>":""}</div><button class="sec" id="qt">Thoát</button>`;
  $("#qt").onclick=()=>{if(room)gameMenu();else findView()};
  function start(){
    t0=Date.now();
    m.innerHTML=`<div class="fhead"><b id="tg">Tìm số 1</b><span id="tt">0.0s</span></div><div class="mu">Bạn <span id="pm">0</span>/${n}</div><div class="pbar"><i id="bm"></i></div>${oppName?`<div class="mu">${esc(oppName)} <span id="po">0</span>/${n} <span id="pn"></span></div><div class="pbar"><i id="bo"></i></div>`:""}<div class="fgrid" style="grid-template-columns:repeat(${n===25?5:10},1fr)">${nums.map((x,i)=>`<button data-n="${x}" style="${sty[i]}">${x}</button>`).join("")}</div><button class="sec" id="qt" style="margin-top:12px">Thoát</button>`;
    $("#qt").onclick=()=>{G.clr&&G.clr();G.clr=null;if(room)gameMenu();else findView()};
    tm=setInterval(tick,100);
    m.querySelector(".fgrid").onclick=tap;
  }
  function tick(){
    const t=$("#tt");if(!t){clearInterval(tm);return}
    if(!done)t.textContent=((Date.now()-t0)/1000).toFixed(1)+"s";
    const op=oppProg();
    if(oppName&&$("#po")){$("#po").textContent=op;$("#bo").style.width=(op/n*100)+"%";const om=oppMs();if(!done&&om&&room&&$("#pn"))$("#pn").textContent="— đã xong trong "+(om/1000).toFixed(1)+"s, cố lên!"}
    if(o.bot&&!done&&op>=n){done=true;clearInterval(tm);result(false,"Máy xong trước ("+(n*o.bot.pace/1000).toFixed(1)+"s) 😅",true)}
  }
  async function tap(e){
    const b=e.target.closest("button[data-n]");if(!b||done||b.classList.contains("ok"))return;
    if(+b.dataset.n!==next){b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),250);return}
    b.classList.add("ok");next++;
    $("#pm").textContent=next-1;$("#bm").style.width=((next-1)/n*100)+"%";
    if(room&&Date.now()-ls>600){ls=Date.now();sb.from("games").update({["p"+mine]:next-1}).eq("id",room.id)}
    if(next<=n){$("#tg").textContent="Tìm số "+next;return}
    done=true;clearInterval(tm);myMs=Date.now()-t0;
    if(room)await sb.from("games").update({["p"+mine]:n,["ms"+mine]:myMs}).eq("id",room.id);
    if(o.bot)result(true,"Bạn thắng máy! 🎉");else if(room)waitOpp();else result(true,"Hoàn thành!");
  }
  function waitOpp(){
    const chk=()=>{const om=oppMs();if(om){clearInterval(G.waitT);const win=myMs<om;result(win,(win?"Bạn thắng! 🎉 ":"")+nm(oc===1?room.host:room.guest)+": "+(om/1000).toFixed(1)+"s")}
      else m.innerHTML=`<div class="gcard" style="text-align:center"><b style="font-size:22px">${(myMs/1000).toFixed(1)} giây</b><div class="mu">Chờ ${esc(oppName)} hoàn thành… (${oppProg()}/${n})</div></div>`};
    clearInterval(G.waitT);G.waitT=setInterval(()=>{if(!$("#main")||G.fsKey===""){clearInterval(G.waitT);return}chk()},700);chk();
    const old=G.clr;G.clr=()=>{old&&old();clearInterval(G.waitT)};
  }
  async function result(win,sub,lost){
    m.innerHTML=`<div class="gcard" style="text-align:center"><div style="font-size:42px">${lost?"😅":win?"🎉":"🏁"}</div><b style="font-size:22px">${lost?"Thua rồi":(myMs/1000).toFixed(1)+" giây"}</b><div class="mu">${sub}</div><div class="mu" id="sv"></div></div><button class="pri" id="ag" style="width:100%;margin:6px 0">Chơi lại</button><button class="sec" id="lb2" style="width:100%">${room?"Về trò chơi":"Xem xếp hạng"}</button>`;
    $("#ag").onclick=async()=>{if(room){await sb.from("games").update({seed:Math.floor(Math.random()*1e9),p1:0,p2:0,ms1:null,ms2:null,status:"playing",v:(G.row&&G.row.v||0)+1}).eq("id",room.id)}else findPlay(n,o.bot?{bot:o.bot}:{})};
    $("#lb2").onclick=room?gameMenu:findView;

  }
}

}
function racePlay(r){
  if(G.clr){G.clr();G.clr=null}
  const m=$("#main"),R=rng(r.seed),n=r.n,slot=(r.players||[]).indexOf(me)+1;
  const nums=[...Array(n).keys()].map(i=>i+1);
  for(let i=n-1;i>0;i--){const j=Math.floor(R()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}
  const sty=nums.map(()=>`font-size:${15+Math.floor(R()*7)}px;transform:rotate(${Math.floor(R()*25)-12}deg)`);
  const st=G.race={built:false,row:r,opt:new Set(),lock:0};let cd=3;
  const cdt=setInterval(()=>{cd--;const e=$("#cd");if(cd<=0){clearInterval(cdt);build()}else if(e)e.textContent=cd},1000);
  G.clr=()=>clearInterval(cdt);
  m.innerHTML=`<div class="gcard" style="text-align:center"><div id="cd" style="font-size:64px;font-weight:700">3</div>Sẵn sàng… cả nhóm cùng tìm một bảng số!</div>`;
  function build(){
    st.built=true;
    m.innerHTML=`<div class="fhead"><b id="tg">Tìm số 1</b><span id="mc" style="color:${RC[Math.max(slot,1)-1]};font-weight:700">Bạn: 0</span></div><div class="pls" id="pls"></div><div class="mu" id="tot"></div><div class="fgrid" id="fg" style="grid-template-columns:repeat(${n===25?5:10},1fr)">${nums.map((x,i)=>`<button data-n="${x}" style="${sty[i]}">${x}</button>`).join("")}</div><button class="sec" id="qt" style="margin-top:12px">Thoát</button>`;
    $("#qt").onclick=gameMenu;$("#fg").onclick=tap;racePaint(st.row);
  }
  async function tap(e){
    const b=e.target.closest("button[data-n]");if(!b||b.disabled||!slot||Date.now()<st.lock)return;
    const x=+b.dataset.n,row=st.row;let nx=row.nxt;while(st.opt.has(nx))nx++;
    if(x!==nx){b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),250);st.lock=Date.now()+800;return}
    st.opt.add(x);racePaint(row);
    const res=await sb.rpc("race_claim",{p_game:row.id,p_num:x});
    if(!res.data||!res.data.ok){
      st.opt.delete(x);const f=await sb.from("games").select("*").eq("id",row.id).maybeSingle();
      racePaint(f.data||st.row);
    }
  }
}
function racePaint(r){
  const st=G.race;if(!st||!st.built)return;st.row=r;
  const ow=r.owners||"",pl=r.players||[],slot=pl.indexOf(me)+1;
  [...st.opt].forEach(x=>{if(x<=ow.length)st.opt.delete(x)});
  document.querySelectorAll("#fg button").forEach(b=>{
    const x=+b.dataset.n;let s=x<=ow.length?+ow[x-1]:st.opt.has(x)?slot:0;
    if(s){b.style.background=RC[s-1];b.style.color="#fff";b.style.opacity=".85";b.disabled=true}
    else{b.style.background="";b.style.color="";b.style.opacity="";b.disabled=false}
  });
  let nx=r.nxt;while(st.opt.has(nx))nx++;
  const mine=cnt(ow,slot)+st.opt.size;
  const tg=$("#tg"),mc=$("#mc"),pls=$("#pls");
  const to=$("#tot");if(to)to.textContent=`Cả nhóm đã tìm: ${Math.min(r.n,ow.length+st.opt.size)}/${r.n} số`;
  if(tg)tg.textContent="Tìm số "+nx;if(mc)mc.textContent="Bạn: "+mine;
  if(pls)pls.innerHTML=pl.map((id,i)=>`<span style="border-color:${RC[i]}"><i style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${RC[i]}"></i> ${av(id,18)} ${id===me?"Bạn":esc(nm(id))}: <b>${id===me?mine:cnt(ow,i+1)}</b></span>`).join("");
}
function raceResult(r){
  if(G.clr){G.clr();G.clr=null}
  const m=$("#main"),pl=r.players||[],ow=r.owners||"";
  const rows=pl.map((id,i)=>({id,i,c:cnt(ow,i+1)})).sort((a,b)=>b.c-a.c);
  const top=rows.length?rows[0].c:0,win=rows.filter(x=>x.c===top);
  m.innerHTML=`<div class="gcard" style="text-align:center"><div style="font-size:42px">🏆</div><b style="font-size:20px">${win.map(x=>esc(nm(x.id))).join(" & ")} thắng với ${top} số!</b><div class="mu">Tổng ${r.n} số</div></div>`
    +rows.map((x,k)=>`<div class="prow"><span>${["🥇","🥈","🥉","4."][k]}</span>${av(x.id,26)}<span class="n" style="color:${RC[x.i]}">${esc(nm(x.id))}${x.id===me?" (bạn)":""}</span><b>${x.c} số</b></div>`).join("")
    +(r.host===me?`<button class="pri" id="ag" style="width:100%;margin:10px 0 6px">Chơi lại</button>`:`<div class="mu" style="margin:10px 0">Chờ chủ phòng chơi lại…</div>`)
    +`<button class="sec" id="lb2" style="width:100%">Về trò chơi</button>`;
  if(r.host===me)$("#ag").onclick=()=>sb.rpc("race_reset",{p_game:r.id});
  $("#lb2").onclick=gameMenu;
}
// ---- Cờ caro
function caroView(){
  leaveRoom();const m=$("#main");
  m.innerHTML=`<button class="sec" id="bk">← Trò chơi</button><h3>⭕ Cờ caro</h3><button class="pri" id="b1" style="width:100%;margin:4px 0">🤖 Chơi với máy</button><button class="pri" id="b2" style="width:100%;margin:4px 0">👥 Rủ người thân chơi online</button><button class="pri" id="b3" style="width:100%;margin:4px 0">📱 2 người một máy</button>`;
  $("#bk").onclick=gameMenu;$("#b1").onclick=()=>caroLocal("ai");$("#b2").onclick=()=>invitePick("caro",0,caroView);$("#b3").onclick=()=>caroLocal("two");
}
function caroCells(b,last,wc){return b.map((v,i)=>`<button data-i="${i}" class="${v===1?"x":v===2?"o":""}${i===last?" last":""}${wc.includes(i)?" win":""}">${v===1?"✕":v===2?"◯":""}</button>`).join("")}
function caroLocal(mode){
  const m=$("#main");let b,turn,over,last,wc;
  const nmz=()=>mode==="ai"?{1:"Bạn (✕)",2:"Máy (◯)"}:{1:"Người 1 (✕)",2:"Người 2 (◯)"};
  function reset(){b=Array(CN*CN).fill(0);turn=1;over=false;last=-1;wc=[];draw()}
  function ai(){let best=-1,bs=-1;b.forEach((v,i)=>{if(v)return;const s=caroScore(b,i,2)*1.05+caroScore(b,i,1)+Math.random();if(s>bs){bs=s;best=i}});if(best>=0)play(best)}
  function play(i){if(over||b[i])return;b[i]=turn;last=i;const w=caroWin(b,i,turn);if(w){over=true;wc=w}else if(b.every(v=>v))over=true;else turn=3-turn;draw();if(!over&&mode==="ai"&&turn===2)setTimeout(()=>{if($("#cg")&&!over)ai()},350)}
  function draw(){
    const z=nmz(),st=over?(wc.length?`🎉 ${z[turn]} thắng!`:"Hòa!"):`Lượt: ${z[turn]}`;
    m.innerHTML=`<button class="sec" id="bk">← Quay lại</button><h3>⭕ Cờ caro ${mode==="ai"?"· với máy":"· 2 người"}</h3><div class="fhead"><b>${st}</b><button class="sec" id="nw">Ván mới</button></div><div class="cgrid" id="cg" style="grid-template-columns:repeat(${CN},1fr)">${caroCells(b,last,wc)}</div>`;
    $("#bk").onclick=caroView;$("#nw").onclick=reset;
    $("#cg").onclick=e=>{const c=e.target.closest("button[data-i]");if(c&&!(mode==="ai"&&turn===2))play(+c.dataset.i)};
  }
  reset();
}
function caroOnline(r){
  const m=$("#main"),side=r.host===me?1:2,b=(r.b||"").split("").map(Number);
  const wc=r.over&&r.winner<3&&r.last>=0?(caroWin(b,r.last,r.winner)||[]):[];
  const turnId=r.turn===1?r.host:r.guest;
  const st=r.over?(r.winner===3?"Hòa!":r.winner===side?"🎉 Bạn thắng!":`😅 ${nm(r.winner===1?r.host:r.guest)} thắng`):(r.turn===side?"👉 Đến lượt bạn":`Chờ ${nm(turnId)}…`);
  m.innerHTML=`<button class="sec" id="bk">← Rời phòng</button><h3>⭕ Cờ caro online</h3><div class="mu">${av(r.host,18)} ${esc(nm(r.host))} ✕ &nbsp;vs&nbsp; ${av(r.guest,18)} ${esc(nm(r.guest))} ◯ ${side===1?"(bạn là ✕)":"(bạn là ◯)"}</div><div class="fhead"><b>${st}</b><button class="sec" id="nw">Ván mới</button></div><div class="cgrid" id="cg" style="grid-template-columns:repeat(${CN},1fr)">${caroCells(b,r.last,wc)}</div>`;
  const upd=async f=>{const x=await sb.from("games").update({...f,v:r.v+1,updated_at:new Date().toISOString()}).eq("id",r.id).eq("v",r.v).select().maybeSingle();if(x.data){G.row=x.data;caroOnline(x.data)}};
  $("#bk").onclick=gameMenu;
  $("#nw").onclick=()=>upd({b:"0".repeat(CN*CN),turn:1,last:-1,over:false,winner:0});
  $("#cg").onclick=e=>{
    const c=e.target.closest("button[data-i]");if(!c||r.over||r.turn!==side)return;
    const i=+c.dataset.i;if(b[i])return;
    const nb=b.slice();nb[i]=side;const w=caroWin(nb,i,side),full=nb.every(v=>v);
    upd({b:nb.join(""),last:i,turn:3-side,over:!!w||full,winner:w?side:full?3:0});
  };
}
function renderChat(){
  const m=$("#main"),first=m.dataset.t!=="chat",n=chat.length,changed=first||n!==window.lastN;window.lastN=n;m.dataset.t="chat";
  m.innerHTML=chat.map(c=>`<div class="msg ${c.sender===me?"me":""} ${c.sender!==me&&mentionsMe(c.body)?"ment":""}"><b>${av(c.sender,18)}${esc(nm(c.sender))}</b>${tagify(c.body)}</div>`).join("")||'<p class="mu">Chưa có tin nhắn.</p>';
  if(!$("#chatbar")){const b=document.createElement("form");b.id="chatbar";
    b.innerHTML='<div id="chips"></div><input type="text" maxlength="500" placeholder="Nhắn cả nhà…"><button class="pri">Gửi</button>';
    b.onsubmit=async e=>{e.preventDefault();const i=b.querySelector("input"),t=i.value.trim();if(!t)return;i.value="";
      const{error}=await sb.from("chat").insert({body:t});if(error)alert(error.message);await load();render()};
    document.body.appendChild(b)}
  const ch=$("#chips");ch.innerHTML=Object.entries(members).filter(([k])=>k!==me).map(([k,v])=>`<button type="button" data-n="${esc(v.name)}">@${esc(v.name)}</button>`).join("");
  ch.querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=$("#chatbar input");i.value+=(i.value&&!/\s$/.test(i.value)?" ":"")+"@"+b.dataset.n+" ";i.focus()});
  if(changed)window.scrollTo(0,document.body.scrollHeight);
}
init();
</script></body></html>
